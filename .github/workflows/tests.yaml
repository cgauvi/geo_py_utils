
on:
  pull_request:
    branches:
      [master, main]
  push:
    branches:
      [master, main, 'fix/74/get_num_coordinates']



jobs:
 
  build:
    runs-on: ${{ matrix.os_py_version.os }}
    strategy:
      matrix:
        os_py_version: [ 
          {os: ubuntu-latest , python-version : '3.9'}, 
          {os: ubuntu-latest , python-version : '3.10'},
          {os: ubuntu-latest , python-version : '3.11'},
          {os: ubuntu-latest , python-version : '3.12'},
          {os: windows-latest , python-version : '3.9'},
          {os: windows-latest , python-version :  '3.10'},
          {os: windows-latest , python-version :  '3.11'}
       ]
       
    defaults:
      run:
        shell: bash -l {0}

    name: Python ${{ matrix.os_py_version.python-version }} - ${{ matrix.os_py_version.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v2
        
      - uses: conda-incubator/setup-miniconda@v2
        with:
          miniconda-version: "latest"
          channels: conda-forge, defaults
          use-only-tar-bz2: true  # IMPORTANT: This needs to be set for caching to work properly!
          auto-update-conda: true
          auto-activate-base: false # dont activate base - activate the geo_py_env
          activate-environment: geo_py_utils


      - name: Create env
        run: |
          conda create --name geo_py_utils python=${{ matrix.os_py_version.python-version }} geopandas
          conda activate geo_py_utils
        shell: bash -l {0}

      - name: Upgrade pip 3.12
        if: matrix.os_py_version.python-version == '3.12'
        run: |
          python -m pip install --upgrade --upgrade-strategy eager -e -r requirements.txt
        shell: bash -l {0}

      - name: Install dependencies rest
        if: matrix.os_py_version.python-version <> '3.12'
        run: |
          python -m pip install -r requirements.txt
        shell: bash -l {0}

      - name: Test with pytest 
        run: |
          conda activate geo_py_utils
          python -m pytest
        shell: bash -el {0}

      - name: Lint with flake8
        run: |
          conda activate geo_py_utils
          # stop the build if there are Python syntax errors or undefined names
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          python -m flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        shell: bash -l {0}
          




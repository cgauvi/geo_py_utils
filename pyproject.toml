[tool.poetry]
name = "geo_py_utils"
version = "1.9.2"
description = "Python functions for generic geospatial manipulations"
authors = ["Charles Gauvin"]

[tool.poetry.dependencies] 
python = {version = ">=3.9,<=3.12"}
brotlipy= {version =">=0.7.0,<1.0.0"}
psycopg2= {version =">=2.0.0,<3.0.0"}
pyarrow= {version ="*"}
pyopenssl= {version =">=23.0.0,<24.0.0"}
pysocks= {version =">=1.7.1,<2.0.0"}
rtree= {version ="*"}
unicodedata2= {version =">=15.0.0,<16.0.0"}
python-geohash= {version =">=0.8.5,<0.9.0"}
shapely= {version ="*"}
sqlalchemy= {version =">=1.4.44,<2", python = ">=3.6.dev0"}
snowflake-connector-python= {version =">=3.0.0,<4.0.0", python = ">=3.8"}
python-dotenv= {version ="*"}
geopandas= {version ="<1.0.0"}
pandas= {version ="<2.2.0"}
pyproj= {version ="*"}
munkres= {version ="*"}
oscrypto = {version ="*"}
Unidecode =  {version ="*"}

[tool.poetry.extras]
notebooks=["seaborn" , "matplotlib", "folium", "mapclassify", "contextily", "xyzservices"]
dev=['pytest','flake8','pyproject-flake8']

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
 
[tool.pytest.ini_options]
minversion = "6.0"
pythonpath = [
  "."
]
testpaths = ["tests"]
addopts =  "-v -m 'not requires_local_pg_connection and not requires_remote_pg_connection_prod and not requires_remote_pg_connection_dev and not requires_remote_pg_connection_sfkl_interactivity and not requires_remote_sfkl_interactivity and not requires_remote_sfkl_ae' "
markers =[
    "requires_local_pg_connection: requires a local postgis db set up. Probably with docker and probably accepting connections on 80:5432 or 80:5052.",
    "requires_remote_pg_connection_prod: requires a remote postgis db set up accepting connections on gcp:dev:5432",
    "requires_remote_pg_connection_dev: requires a remote postgis db set up accepting connections on gcp:prod:5432",
    "requires_remote_pg_connection_sfkl_interactivity:  requires a remote postgis db + sfkl interactive external browser auth USE `-s`  ",
    "requires_remote_sfkl_interactivity: requires ability to propagate sso conenction in external browser",
    "requires_remote_sfkl_ae: requires ability to connect to sfkl from ae",
    "requires_or2ogr: requires a working gdal and ogr2ogr executable which can be found",
    "windows_specific: used to test windows compatibility",
    "linux_specific: for linux tests"
    ]

[tool.flake8]
    max-complexity = 10
    max-line-length = 100
    ignore = [
        "W291",
        "W292",
        "W293",
        "E122",
        "E128",
        "E203",
        "E211",
        "E214",
        "E121",
        "E127", 
        "E231",
        "E242",
        "E251",
        "E261",
        "E303"
    ]
    select = ["F"]


